<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{{ title }}</title>
  {% if description %}<meta name="description" content="{{ description }}">{% endif %}
  <meta name="generator" content="ovid2 manual build">
  <script>
    /* Pre-paint theme: the reader's last choice, else the OS preference. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("ovid2ManualTheme"); } catch (e) { /* ignore */ }
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="{{ root }}static/favicon.svg">
  <link rel="stylesheet" href="{{ root }}static/manual-static.css">
  <link rel="stylesheet" href="{{ root }}static/manual.css">
  <script src="{{ root }}static/manual.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#om-article">Skip to content</a>
  <header class="site-top">
    <a class="site-top-brand" href="{{ root }}index.html">Ovid<span>2</span> <em>Manual</em></a>
    <span class="site-top-spacer"></span>
    <span class="site-top-version">v{{ version }}</span>
    <button class="site-theme" type="button" aria-label="Toggle light / dark theme" title="Toggle light / dark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </header>
  <main class="site-main">
    {{ fragment }}
  </main>
  <footer class="site-foot">
    Ovid2 {{ version }} &middot; built {{ built }} &middot; MIT &middot; <em>Fidelity over fortune.</em>
  </footer>
  <script>
    (function () {
      var btn = document.querySelector(".site-theme");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var root = document.documentElement;
        var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("ovid2ManualTheme", next); } catch (e) { /* ignore */ }
      });
    })();
  </script>
</body>
</html>
