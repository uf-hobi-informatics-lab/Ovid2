domain_description: Standardized qualitative and quantitative clinical observations about a patient, including
  vital signs. Some observations may also be represented in the VITAL table
domain_order: 17
constraints:
- field: OBSCLINID
  rule: unique
  order: 69
- field: OBSCLINID
  rule: required, not null
  order: 70
- field: PATID
  rule: required, not null
  order: 71
- field: OBSCLIN_START_DATE
  rule: required, not null
  order: 72
relations:
- relation: PK
  details: OBSCLINID
  order: 49
