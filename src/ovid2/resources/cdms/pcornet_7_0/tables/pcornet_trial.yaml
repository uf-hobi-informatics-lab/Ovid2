v: 1
name: pcornet_trial
composite_key:
- PATID
- TRIALID
- PARTICIPANTID
domain_description: Patients who are enrolled in PCORnet clinical trials and PCORnet studies.
domain_order: 12
constraints:
- field: PATID + TRIALID + PARTICIPANTID
  rule: unique
  order: 50
- field: PATID
  rule: required, not null
  order: 51
- field: TRIALID
  rule: required, not null
  order: 52
- field: PARTICIPANTID
  rule: required, not null
  order: 53
relations:
- relation: Composite Key
  details: PATID + TRIALID + PARTICIPANTID
  order: 33
- relation: FK (many to one)
  details: PCORNET.PATID references DEMOGRAPHIC.PATID
  order: 34
fields:
- name: PATID
  rdbms_type: RDBMS Text(x)
  order: 224
  sas_type: SAS Char(x)
  definition: Arbitrary person-level identifier used to link across tables.
- name: TRIALID
  rdbms_type: RDBMS Text(20)
  order: 225
  sas_type: SAS Char(20)
  definition: Each TRIALID is assigned by the PCORnet trial’s coordinating center.
- name: PARTICIPANTID
  rdbms_type: RDBMS Text(x)
  order: 226
  sas_type: SAS Char(x)
  definition: Arbitrary person-level identifier used to uniquely identify a participant in a PCORnet trial.
    PARTICIPANTID is never repeated or reused for a specific clinical trial, and is generally assigned
    by trial-specific processes. It may be the same as a randomization ID.
- name: TRIAL_SITEID
  rdbms_type: RDBMS Text(x)
  order: 227
  sas_type: SAS Char(x)
  definition: Each TRIAL_SITEID is assigned by the PCORnet trial coordinating center.
- name: TRIAL_ENROLL_DATE
  rdbms_type: RDBMS Date
  order: 228
  sas_type: SAS Date (Numeric)
  unit_of_measure: DATE
  definition: Date on which the participant enrolled in the trial (generally coincides with trial consent
    process).
- name: TRIAL_END_DATE
  rdbms_type: RDBMS Date
  order: 229
  sas_type: SAS Date (Numeric)
  unit_of_measure: DATE
  definition: Date on which the participant completes participation in the trial.
- name: TRIAL_WITHDRAW_DATE
  rdbms_type: RDBMS Date
  order: 230
  sas_type: SAS Date (Numeric)
  unit_of_measure: DATE
  definition: If applicable, date on which the participant withdraws consent from the trial.
- name: TRIAL_INVITE_CODE
  rdbms_type: RDBMS Text(20)
  order: 231
  sas_type: SAS Char(20)
  definition: Textual strings used to uniquely identify invitations sent to potential participants, and
    allows acceptances to be associated back to the originating source. Where used, there should generally
    be a unique combination of PATID, TRIAL_NAME, and INVITE_CODE within each datamart. For example, this
    might include “co-enrollment ID strings” for e-mail invites or “verification codes” for letter invites.
