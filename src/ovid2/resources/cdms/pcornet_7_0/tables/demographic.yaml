  definition: Optional field for originating value of field, prior to mapping into the PCORnet CDM value
    set.
- name: RAW_GENDER_IDENTITY
  rdbms_type: RDBMS Text(x)
  order: 21
  sas_type: SAS Char(x)
  definition: Optional field for originating value of field, prior to mapping into the PCORnet CDM value
    set.
- name: RAW_HISPANIC
  rdbms_type: RDBMS Text(x)
  order: 22
  sas_type: SAS Char(x)
  definition: Optional field for originating value of field, prior to mapping into the PCORnet CDM value
    set.
- name: RAW_RACE
  rdbms_type: RDBMS Text(x)
  order: 23
  sas_type: SAS Char(x)
  definition: Optional field for originating value of field, prior to mapping into the PCORnet CDM value
    set.
- name: RAW_PAT_PREF_LANGUAGE_SPOKEN
