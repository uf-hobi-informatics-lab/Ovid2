- name: PX_DATE
  rdbms_type: RDBMS Date
  order: 85
  sas_type: SAS Date (Numeric)
  unit_of_measure: DATE
  definition: PX_DATE should reflect the date the procedure was performed, if known. Leave blank if you
    cannot determine if or when the procedure was performed.
- name: PX
  rdbms_type: RDBMS Text(11)
  order: 86
  sas_type: SAS Char(11)
  definition: Procedure code.
- name: PX_TYPE
  rdbms_type: RDBMS Text(2)
  order: 87
  sas_type: SAS Char(2)
  valueset: pcornet_7_0.procedures.px_type
  definition: 'Procedure code type. We include a number of code types for flexibility, but the basic requirement
    that the code refer to a medical procedure remains. Revenue codes are a standard concept in Medicare
    billing and can be useful for defining care settings. If those codes are available they can be included.
    Medications administered by clinicians can be captured in billing data and Electronic Health Records
    (EHRs) as HCPCS procedure codes. Administration (infusion) of chemotherapy is an example.  We are
    now seeing NDCs captured as part of procedures because payers are demanding it for payment authorization.
    Inclusion of this code type enables those data pipelines that capture the NDC along with the procedure
    to include the data. Please note: The “Other” category is meant to identify internal use ontologies
    and codes. Value set modified in v3.1 to combine CPT and HCPCS codes into one category; also, ICD-9
    value set item typo corrected to ICD-9-PCS.'
- name: PX_SOURCE
  rdbms_type: RDBMS Text(2)
  order: 88
  sas_type: SAS Char(2)
  valueset: pcornet_7_0.procedures.px_source
  definition: Source of the procedure information. Order and billing pertain to internal healthcare processes
    and data sources. Claim pertains to data from the bill fulfillment, generally data sources held by
    insurers and other health plans. Length of data types updated in v3.1.
- name: PPX
  rdbms_type: RDBMS Text(2)
  order: 89
  sas_type: SAS Char(2)
  valueset: pcornet_7_0.procedures.ppx
  definition: Principal procedure flag.
- name: RAW_PX
