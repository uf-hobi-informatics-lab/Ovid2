v: 1
name: condition
composite_key:
- CONDITIONID
domain_description: A condition represents a patient’s diagnosed and self-reported health conditions and
  diseases. The patient’s medical history and current state may both be represented.
domain_order: 9
constraints:
- field: CONDITIONID
  rule: unique
  order: 37
- field: CONDITIONID
  rule: required, not null
  order: 38
- field: PATID
  rule: required, not null
  order: 39
- field: CONDITION
  rule: required, not null
  order: 40
- field: CONDITION_TYPE
  rule: required, not null
  order: 41
- field: CONDITION_SOURCE
  rule: required, not null
  order: 42
relations:
- relation: PK
  details: CONDITIONID
  order: 24
- relation: FK (many to one)
  details: CONDITION.PATID references DEMOGRAPHIC.PATID
  order: 25
- relation: FK (zero/many to one)
  details: CONDITION.ENCOUNTERID references ENCOUNTER.ENCOUNTERID
  order: 26
fields:
- name: CONDITIONID
  rdbms_type: RDBMS Text(x)
  order: 162
  sas_type: SAS Char(x)
  definition: Arbitrary identifier for each unique record. Does not need to be persistent across refreshes,
    and may be created by methods such as sequence or GUID.
- name: PATID
  rdbms_type: RDBMS Text(x)
  order: 163
  sas_type: SAS Char(x)
  definition: Arbitrary person-level identifier. Used to link across tables.
- name: ENCOUNTERID
  rdbms_type: RDBMS Text(x)
  order: 164
  sas_type: SAS Char(x)
  definition: Arbitrary encounter-level identifier used to link across tables. This is an optional field,
    and should only be populated if the item was collected as part of a healthcare encounter. If more
    than one encounter association is present, this field should be populated with the ID of the encounter
    when the condition was first entered into the system. However, please note that many conditions may
    be recorded outside of an encounter context.
- name: REPORT_DATE
  rdbms_type: RDBMS Date
  order: 165
  sas_type: SAS Date (Numeric)
  unit_of_measure: DATE
  definition: Date condition was noted, which may be the date when it was recorded by a provider or nurse,
    or the date on which the patient reported it. Please note that this date may not correspond to onset
    date.
- name: RESOLVE_DATE
  rdbms_type: RDBMS Date
  order: 166
  sas_type: SAS Date (Numeric)
  unit_of_measure: DATE
  definition: Date condition was resolved, if resolution of a transient condition has been achieved. A
    resolution date is not generally expected for chronic conditions, even if the condition is managed.
- name: ONSET_DATE
  rdbms_type: RDBMS Date
  order: 167
  sas_type: SAS Date (Numeric)
  unit_of_measure: DATE
  definition: The onset date concept here refers to "the date and time when problem (illness, disorder,
    or symptom) started" (ONC:MU Clinical Data Set, caDSR 4973971).  This is a different concept than
    report date, which is the date on which the medical status was collected. An onset date should generally
    be considered independently of the observer or provider. However, the judgment of when a condition
    "started" depends on the disease, the frequency of visits, and many other factors. It is not clear
    that any facility or physician employs this field in a manner which can be trusted without validation
    during analysis. (New definition added in v3.1.)
- name: CONDITION_STATUS
  rdbms_type: RDBMS Text(2)
  order: 168
  sas_type: SAS Char(2)
  valueset: pcornet_7_0.condition.condition_status
  definition: Condition status corresponding with REPORT_DATE.
- name: CONDITION
  rdbms_type: RDBMS Text(18)
  order: 169
  sas_type: SAS Char(18)
  definition: Condition code. Some codes will contain leading zeroes, and different levels of decimal
    precision may also be present. This field is a character field, not numeric, to accommodate these
    coding conventions. Please populate the exact value of this diagnosis code, but remove any source-specific
    suffixes and prefixes. (Description updated in v3.1.)
- name: CONDITION_TYPE
  rdbms_type: RDBMS Text(2)
  order: 170
  sas_type: SAS Char(2)
  valueset: pcornet_7_0.condition.condition_type
  definition: 'Condition code type.  Please note: The “Other” category is meant to identify internal use
    ontologies and codes.'
- name: CONDITION_SOURCE
  rdbms_type: RDBMS Text(2)
  order: 171
  sas_type: SAS Char(2)
  valueset: pcornet_7_0.condition.condition_source
  definition: 'Please note: The “Patient-reported” category can include reporting by a proxy, such as
    patient’s family or guardian.'
- name: RAW_CONDITION_STATUS
  rdbms_type: RDBMS Text(x)
  order: 172
  sas_type: SAS Char(x)
  definition: Optional field for originating value of field, prior to mapping into the PCORnet CDM value
    set.
- name: RAW_CONDITION
  rdbms_type: RDBMS Text(x)
  order: 173
  sas_type: SAS Char(x)
  definition: Optional field for originating value of field, prior to mapping into the PCORnet CDM value
    set.
- name: RAW_CONDITION_TYPE
  rdbms_type: RDBMS Text(x)
  order: 174
  sas_type: SAS Char(x)
  definition: Optional field for originating value of field, prior to mapping into the PCORnet CDM value
    set.
- name: RAW_CONDITION_SOURCE
  rdbms_type: RDBMS Text(x)
  order: 175
  sas_type: SAS Char(x)
