  order: 70
fields:
- name: PATID_1
  rdbms_type: RDBMS Text(x)
  order: 473
  sas_type: SAS Char(x)
  definition: 'Arbitrary person-level identifier used to link across tables.


    PATID of the first patient in the relationship link.'
- name: PATID_2
  rdbms_type: RDBMS Text(x)
  order: 474
  sas_type: SAS Char(x)
  definition: 'Arbitrary person-level identifier used to link across tables.


    PATID of the second patient in the relationship link.'
- name: RELATIONSHIP_TYPE
  rdbms_type: RDBMS Text(2)
  order: 475
  sas_type: SAS Char(2)
  valueset: pcornet_7_0.pat_relationship.relationship_type
  definition: 'Code denoting the relationship between the two patients.


    The order of the terms indicates directionality.  For instance, if using “birth mother – child”, PATID_1
    represents birth mother, PATID_2, the child.'
- name: RELATIONSHIP_START
  rdbms_type: RDBMS Date
  order: 476
  sas_type: SAS Date (Numeric)
  unit_of_measure: DATE
  definition: The date the indicated relationship was believed to have started, if known.
- name: RELATIONSHIP_END
  rdbms_type: RDBMS Date
  order: 477
  sas_type: SAS Date (Numeric)
  unit_of_measure: DATE
  definition: The date the indicated relationship was believed to have ended, if known.
