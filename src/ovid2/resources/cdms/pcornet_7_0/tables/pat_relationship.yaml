domain_description: This table is used to store information about the relationships between patients within
  a given PCORnet® Common Data Model.
domain_order: 24
constraints:
- field: PATID_1
  rule: required, not null
  order: 98
- field: PATID_2
  rule: required, not null
  order: 99
- field: RELATIONSHIP_TYPE
  rule: required, not null
  order: 100
relations:
- relation: Composite Key
  details: PATID_1 + PATID_2 + RELATIONSHIP_TYPE
  order: 68
- relation: FK (many to one)
  details: PAT_RELATIONSHIP.PATID_1 references DEMOGRAPHIC.PATID
  order: 69
- relation: FK (many to one)
