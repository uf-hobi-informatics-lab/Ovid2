# Ovid-specific dedup-key overrides. These win over the primary-key
# values declared in `tables/<table>.yaml` (which mirror the PCORnet
# 7.0 xlsx spec verbatim). They encode dedup semantics inherited from
# Ovid's PCORnet 6.x pipeline, where several tables lacked surrogate
# IDs and were deduped on their natural composite keys instead. When
# migrating to v7.0-native surrogate keys, remove the corresponding
# entry from this block.
composite_key_overrides:
  harvest:                   [DATAMARTID]
  diagnosis:                 [ENCOUNTERID, DX, DX_TYPE]
  procedures:                [ENCOUNTERID, PX, PX_TYPE]
  vital:                     [ENCOUNTERID, MEASURE_DATE, MEASURE_TIME]
  death:                     [PATID]
  death_cause:               [PATID, DEATH_CAUSE, DEATH_CAUSE_CODE]
  hash_token:                [PATID]
  lab_history:               [LAB_HISTORY_ID]
  private_address_history:   [ADDRESSID]
  private_address_geocode:   [GEOCODEID]
  pcornet_trial:             [PATID, TRIALID]
