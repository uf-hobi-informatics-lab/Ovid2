      dict: vital_bp_position_dict
      col: BP_POSITION
  - SMOKING:
      dict: vital_smoking_dict
      col: SMOKING
  - TOBACCO:
      dict: vital_tobacco_dict
      col: TOBACCO
  - TOBACCO_TYPE:
      dict: vital_tobacco_type_dict
      col: TOBACCO_TYPE
  - RAW_DIASTOLIC
  - RAW_SYSTOLIC
  - RAW_BP_POSITION
  - RAW_SMOKING
  - RAW_TOBACCO
  - RAW_TOBACCO_TYPE
  - UPDATED:
      updated: true
  - SOURCE:
      source: true
  append_additional_fields:
    join_field: VITALID
