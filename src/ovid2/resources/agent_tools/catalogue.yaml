# Ovid2 agent tool catalogue (v1).
#
# The allow-list of /api/v1 operations the right-panel assistant may call.
# Schema: resources/schemas/agent_tools.v1.json. Loader:
# ovid2.agent_tools.catalogue. Contract: tests/contract/test_agent_tools_catalogue.py
# (every entry must match a real route + capability in the OpenAPI snapshot).
#
#   method: GET   -> executed by the LLM executor with a short-lived,
#                    GET-only token carrying the chatting user's role
#                    (capped at pipeline_operator).
#   method: POST/PUT -> NEVER executed by the executor. Surfaced to the
#                    human as a proposal card; the browser runs it with the
#                    user's own session. Destructive ops are not listed.
#   opens_draft: true -> (draft-job creation ONLY) the browser runs the call
#                    without a proposal click and opens the draft's run page.
#                    A draft never executes; the human gate is the ▶ there.
#                    Description must start with DRAFT (contract-enforced).
#   ui_action: true -> (cosmetic) no method/path. The browser validates +
#                    applies the change to its own UI, saves it to the user's
#                    own appearance profile, and shows Undo. Description must
#                    start with UI: (contract-enforced).
#
# Deliberately excluded (PHI / privilege): secrets, settings, install,
# users, approvals, LLM connections, storage browse, pipeline file
# preview, filesystem listing, Data Space table *rows* (sample / export /
# artifact download — only the metadata-only ods_describe_table is
# listed), any DELETE.
v: 1
tools:
  # ---------------------------------------------------------------- status
  - name: health
    description: Liveness of the Ovid2 API (version, uptime).
    method: GET
    path: /api/v1/health
    capability: view_public

  - name: list_workspaces
    description: >-
      The workspace this conversation runs in (and the user's other
      workspaces). Every other tool only sees items of the active workspace;
      the assistant cannot switch it - the user does, from the top bar.
    method: GET
    path: /api/v1/me/workspaces
    capability: view_public

  - name: list_cdms
    description: List the registered common data models (PCORnet, OMOP, ...).
    method: GET
    path: /api/v1/cdms
    capability: view_public

  - name: get_cdm
    description: Describe one CDM - its tables, composite keys and reference tables.
    method: GET
    path: /api/v1/cdms/{name}
    capability: view_public
    params:
      type: object
      required: [name]
      properties:
        name: {type: string, description: "CDM name, e.g. pcornet_7_0."}

  # ------------------------------------------------------------ runs / jobs
  - name: list_jobs
    description: >-
      List web-submitted jobs, newest first. Each job has job_id, instance_id,
      pipeline, kind, status (queued/running/succeeded/failed/cancelled).
    method: GET
    path: /api/v1/jobs
    capability: view_runs
    params:
      type: object
      properties:
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        offset: {type: integer, minimum: 0, default: 0}
        status: {type: string, description: "Exact status filter, e.g. failed."}
        pipeline: {type: string, description: "Pipeline name filter."}

  - name: get_job
    description: Full detail for one job (payload, status, timestamps, exit code).
    method: GET
    path: /api/v1/jobs/{job_id}
    capability: view_runs
    params:
      type: object
      required: [job_id]
      properties:
        job_id: {type: string}

  - name: get_job_log
    description: >-
      Tail of a job's stdout/stderr log. Use it to diagnose a failed job.
    method: GET
    path: /api/v1/jobs/{job_id}/log
    capability: view_runs
    max_result_chars: 12000
    truncate: tail
    params:
      type: object
      required: [job_id]
      properties:
        job_id: {type: string}

  - name: list_runs
    description: List batch runs from the batch tracker (batch_id, pipeline, status, instance_id).
    method: GET
    path: /api/v1/runs
    capability: view_runs
    params:
      type: object
      properties:
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}
        offset: {type: integer, minimum: 0, default: 0}
        status: {type: string, description: "NEW | PROCESSING | PROCESSED | ERROR"}
        pipeline: {type: string}

  - name: get_run
    description: One batch run by batch_id (the input's Data Space path) or instance_id.
    method: GET
    path: /api/v1/runs/{batch_id}
    capability: view_runs
    params:
      type: object
      required: [batch_id]
      properties:
        batch_id: {type: string}

  - name: run_timeline
    description: >-
      Aggregated timeline of a run (per-table status, per-stage counters,
      fixes applied, error/warning counts). Keyed by instance_id.
    method: GET
    path: /api/v1/runs/{instance_id}/timeline
    capability: view_runs
    params:
      type: object
      required: [instance_id]
      properties:
        instance_id: {type: string}

  - name: run_events
    description: Page of raw structured events from a run's event log (cursor-based).
    method: GET
    path: /api/v1/runs/{instance_id}/events
    capability: view_runs
    params:
      type: object
      required: [instance_id]
      properties:
        instance_id: {type: string}
        after: {type: integer, minimum: 0, default: 0, description: "Cursor from the previous page."}
        limit: {type: integer, minimum: 1, maximum: 200, default: 100}

  - name: get_health_report
    description: Data-health (EDC) report for a health run.
    method: GET
    path: /api/v1/runs/{instance_id}/report
    capability: view_runs
    params:
      type: object
      required: [instance_id]
      properties:
        instance_id: {type: string}

  - name: list_health_checks
    description: Catalogue of data-health / EDC checks that a health run can execute.
    method: GET
    path: /api/v1/health/checks
    capability: view_runs

  - name: list_health_packages
    description: EDC report-cycle packages (e.g. 20r1) and their member checks.
    method: GET
    path: /api/v1/health/packages
    capability: view_runs

  - name: get_repair_context
    description: >-
      Failed checks of a health run, ordered by severity, with the domain
      pack's remediation hint and the fixers / transforms that typically
      repair each one (aggregate only, no row values). Use it to propose a
      fix with the PROPOSE tools.
    method: GET
    path: /api/v1/runs/{instance_id}/repair-context
    capability: view_runs
    params:
      type: object
      required: [instance_id]
      properties:
        instance_id: {type: string}

  - name: list_packs
    description: Domain packs (built-in / installed / folder) with activation state and what each provides.
    method: GET
    path: /api/v1/packs
    capability: view_runs

  - name: get_pack
    description: One domain pack and the health checks / report-cycle packages it contributes.
    method: GET
    path: /api/v1/packs/{pack_id}
    capability: view_runs
    params:
      type: object
      required: [pack_id]
      properties:
        pack_id: {type: string}

  - name: list_transforms
    description: Public transformations library (op names, categories, parameters).
    method: GET
    path: /api/v1/transforms
    capability: view_runs
    params:
      type: object
      properties:
        category: {type: string, description: "formatting / correction / reshape / sampling"}

  - name: list_transform_library
    description: Reusable transform chains (user library + shipped), with their ops.
    method: GET
    path: /api/v1/transform-library
    capability: view_pipeline_data

  - name: get_transform_library_chain
    description: One reusable transform chain (raw YAML + parsed steps).
    method: GET
    path: /api/v1/transform-library/{name}
    capability: view_pipeline_data
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}

  - name: save_transform_library_chain
    description: >-
      PROPOSE creating or updating a reusable transform chain in the user
      library. raw_text is YAML {v: 1, description, steps: [{op, ...params}]}
      using ops from list_transforms; derive_column / filter_expr take an
      allow-listed Spark-SQL row expression. The server validates on save.
      The user must confirm.
    method: PUT
    path: /api/v1/transform-library/{name}
    capability: manage_config
    params:
      type: object
      required: [name, raw_text]
      properties:
        name: {type: string, description: "lower-case, digits, _"}
        raw_text: {type: string}

  - name: assign_transform_chain
    description: >-
      PROPOSE assigning a library transform chain to tables of a pipeline
      package so its transform stage runs it (between deduplicate and map).
      The user must confirm.
    method: POST
    path: /api/v1/transform-library/{name}/assign
    capability: manage_config
    params:
      type: object
      required: [name, pipeline, tables]
      properties:
        name: {type: string}
        pipeline: {type: string}
        tables: {type: array, items: {type: string}, description: "CDM tables, or ['*']"}

  # --------------------------------------------------------- configuration
  - name: list_pipeline_configs
    description: >-
      List saved pipeline configurations (named, runnable job templates with
      kind, input/output, tables, packages, schedule, enabled flag). Names
      here (e.g. DC_CHECKS) are configs, NOT pipeline packages - read one
      with get_pipeline_config. A config may keep its input or output open
      (empty address); the run must then supply it. Each entry carries
      engine (config name) and engine_type (pyspark / databricks_spark /
      snowpark) plus a free-text description. Call this FIRST for any
      "copy / move A to B [using <engine>]" request and pick the config
      whose kind matches (copy or move) and whose engine_type equals the
      requested engine (e.g. "using snowpark" -> engine_type snowpark).
      cdm is the model an etl config WRITES and input_cdm the model it READS
      (null = same as cdm): "convert OMOP to PCORnet" means input_cdm
      omop_5_3 and cdm pcornet_7_0; if several match, ask which one. Takes
      no arguments (no limit / offset) - it returns every config.
    method: GET
    path: /api/v1/pipelines
    capability: view_pipeline_data

  - name: get_pipeline_config
    description: >-
      One saved pipeline configuration by name (kind, pipeline, input/output
      address, tables, packages, checks, engine, workers).
    method: GET
    path: /api/v1/pipelines/{name}
    capability: view_pipeline_data
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}

  - name: list_pipeline_packages
    description: List installed pipeline packages (code under ovid2_pipelines) and their CDM.
    method: GET
    path: /api/v1/pipeline-packages
    capability: view_pipeline_data

  - name: get_pipeline_package
    description: >-
      Detail for one installed code package under ovid2_pipelines (tables,
      formatters, mappers, fixers). Not for saved configs - use
      get_pipeline_config for names returned by list_pipeline_configs.
    method: GET
    path: /api/v1/pipeline-packages/{pipeline}
    capability: view_pipeline_data
    params:
      type: object
      required: [pipeline]
      properties:
        pipeline: {type: string}

  - name: get_pipeline_plan
    description: The execution plan (per-table stage chain) a pipeline package would run.
    method: GET
    path: /api/v1/pipeline-packages/{pipeline}/plan
    capability: view_pipeline_data
    params:
      type: object
      required: [pipeline]
      properties:
        pipeline: {type: string}

  - name: inspect_pipeline_template
    description: >-
      What a pipeline template provides before creating a pipeline from it:
      every CDM table with formatter / source-file patterns / mapper / fix
      chain, the identity constants (template value + clone default), the
      required engine family, and every name that must match other
      configuration (status ok/warn/error).
    method: GET
    path: /api/v1/pipeline-templates/{template_id}
    capability: view_pipeline_data
    params:
      type: object
      required: [template_id]
      properties:
        template_id: {type: string}
        name: {type: string, description: "Planned pipeline name"}
        engine: {type: string}

  - name: inspect_pipeline_package
    description: >-
      Static inspection of an installed pipeline package: tables x stages
      (format, transform, map, fix), identity constants and name checks.
    method: GET
    path: /api/v1/pipeline-packages/{pipeline}/inspect
    capability: view_pipeline_data
    params:
      type: object
      required: [pipeline]
      properties:
        pipeline: {type: string}
        engine: {type: string}

  - name: inspect_pipeline_lineage
    description: >-
      Field-level lineage of a pipeline package (static, never runs it).
      Without table: per-table stage summary. With table: every field and
      the ordered steps (format, deduplicate, transform, map, fix) that read
      or write it, with params and the defining document.
    method: GET
    path: /api/v1/pipeline-packages/{pipeline}/lineage
    capability: view_pipeline_data
    params:
      type: object
      required: [pipeline]
      properties:
        pipeline: {type: string}
        table: {type: string}

  - name: atlas_subgraph
    description: >-
      The Ovid Atlas around the nodes the user selected (static metadata and
      links only, never row values or secrets). Node ids look like
      config:<name>, package:<name>, engine:<name>, address:<name>,
      account:<name>, workflow:<name>. Returns each node's layer (storage /
      compute / algorithm), kind, metadata and the beams linking them
      (reads, writes, runs_on, implements, holds, step, flows). Use it when
      the user asks about an Atlas selection; propose changes with the
      existing PROPOSE tools.
    method: GET
    path: /api/v1/atlas/subgraph
    capability: view_pipeline_data
    params:
      type: object
      required: [ids]
      properties:
        ids: {type: string, description: "Comma-separated node ids."}
        depth: {type: integer, minimum: 0, maximum: 2, default: 1}

  - name: atlas_live
    description: >-
      What is running in the workspace right now: every queued / running /
      just-finished job with its run config, pause state, per-table status and
      timings, and the stage each running table is in (read, format,
      deduplicate, transform, map, fix, write; steps before write only build
      the lazy plan).
    method: GET
    path: /api/v1/atlas/live
    capability: view_runs

  - name: check_pipeline_bindings
    description: >-
      Every name a pipeline package must match elsewhere (CDM, identity,
      engine family, salt keys, dictionaries, fixer references and lists,
      class paths, vocabularies, transform assignments) with ok/warn/error.
    method: GET
    path: /api/v1/pipeline-packages/{pipeline}/bindings
    capability: view_pipeline_data
    params:
      type: object
      required: [pipeline]
      properties:
        pipeline: {type: string}
        engine: {type: string}

  - name: get_transform_assignments
    description: Which transform chains a pipeline package's transform stage runs per table.
    method: GET
    path: /api/v1/pipeline-packages/{pipeline}/transform-assignments
    capability: view_pipeline_data
    params:
      type: object
      required: [pipeline]
      properties:
        pipeline: {type: string}

  - name: list_formatters
    description: Formatter specs defined by a pipeline package.
    method: GET
    path: /api/v1/pipeline-packages/{pipeline}/formatters
    capability: view_pipeline_data
    params:
      type: object
      required: [pipeline]
      properties:
        pipeline: {type: string}

  - name: get_formatter
    description: One formatter spec (YAML as JSON) for a pipeline table.
    method: GET
    path: /api/v1/pipeline-packages/{pipeline}/formatters/{table}
    capability: view_pipeline_data
    params:
      type: object
      required: [pipeline, table]
      properties:
        pipeline: {type: string}
        table: {type: string}

  - name: list_mappers
    description: Mapper specs defined by a pipeline package.
    method: GET
    path: /api/v1/pipeline-packages/{pipeline}/mappers
    capability: view_pipeline_data
    params:
      type: object
      required: [pipeline]
      properties:
        pipeline: {type: string}

  - name: get_mapper
    description: One mapper spec for a pipeline table.
    method: GET
    path: /api/v1/pipeline-packages/{pipeline}/mappers/{table}
    capability: view_pipeline_data
    params:
      type: object
      required: [pipeline, table]
      properties:
        pipeline: {type: string}
        table: {type: string}

  - name: list_addresses
    description: List address configs (named input/output endpoints used by runs).
    method: GET
    path: /api/v1/addresses
    capability: view_pipeline_data

  - name: get_address
    description: One address config (secrets are never included).
    method: GET
    path: /api/v1/addresses/{name}
    capability: view_pipeline_data
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}

  - name: list_connections
    description: List storage connections (type and non-secret fields only).
    method: GET
    path: /api/v1/connections
    capability: view_pipeline_data

  - name: get_connection
    description: One storage connection (non-secret fields only).
    method: GET
    path: /api/v1/connections/{name}
    capability: view_pipeline_data
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}

  - name: list_connection_types
    description: >-
      Storage account types (disc, s3, azure_blob, snowflake, ...) and the
      fields each needs (non-secret args and the NAMES of secret fields).
      Read before create_connection.
    method: GET
    path: /api/v1/connections/types
    capability: view_pipeline_data

  - name: get_automation_status
    description: >-
      Whether automatic triggers fire on this server (dispatch_enabled -
      watch / cron / interval on pipelines and workflows). When it is false a
      watch workflow will not start by itself; tell the user an administrator
      must turn on "route dispatch" under Settings.
    method: GET
    path: /api/v1/automation
    capability: view_pipeline_data

  - name: list_engines
    description: List compute engines (pyspark, databricks, snowpark ...).
    method: GET
    path: /api/v1/engines
    capability: view_pipeline_data

  - name: get_engine
    description: One compute engine config.
    method: GET
    path: /api/v1/engines/{name}
    capability: view_pipeline_data
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}

  # ------------------------------------------------------------ data space
  - name: ods_list
    description: Ovid Data Space - list a folder or schema. '/' lists storage accounts; '/<account>/<folder...>' lists that folder or DATABASE/SCHEMA. Every store is a tree of plain directories; a folder's full path is the batch id of a run reading it.
    method: GET
    path: /api/v1/dataspace
    capability: view_pipeline_data
    params:
      type: object
      properties:
        path: {type: string, description: "e.g. / or /inbox/landing or /sf_prod/CHAR_DB"}

  - name: ods_list_dimensions
    description: Ovid Data Space - the storage types (disc, snowflake, s3, ...) and how many addresses use each.
    method: GET
    path: /api/v1/dataspace/dimensions
    capability: view_pipeline_data

  - name: ods_resolve
    description: >-
      Resolve a Data Space path (/<account>/<folder...>) to its storage
      account, exact location, batch id and matching saved address. When the
      account does not exist the error lists close account names and, for
      folder stores, a suggested new disc account (name + host_path) next to
      an existing one - propose it with create_connection.
    method: GET
    path: /api/v1/dataspace/resolve
    capability: view_pipeline_data
    params:
      type: object
      required: [path]
      properties:
        path: {type: string, description: "e.g. /inbox/landing/2026_03"}

  - name: ods_describe_table
    description: >-
      Ovid Data Space - describe one table / data file (metadata only, no
      row values) - its fields and types, row count (exact or estimate),
      size, last modified, part files, and for databases the table
      definition. Path is /<account>/<folder...>/<file> or
      /<account>/<DATABASE>/<SCHEMA>/<TABLE>, as listed by ods_list.
    method: GET
    path: /api/v1/dataspace/table
    capability: view_pipeline_data
    params:
      type: object
      required: [path]
      properties:
        path: {type: string, description: "e.g. /inbox/landing/2026_03/DEMOGRAPHIC.csv or /sf_prod/CDM_DB/SITE_X/DEMOGRAPHIC"}

  # ======================================================= drafts (write)
  # Executed by the user's browser WITHOUT a click: it only creates a draft
  # job (never claimed by the worker) and opens its run page, where the
  # human presses ▶ to run it.

  - name: create_job_draft
    description: >-
      DRAFT a fully specified job and open it on the Jobs page, ready to run
      (nothing executes until the user presses Run). Use for "run X on A
      into B". kind is one of etl, analysis, dq_checks, health, copy, move.
      If a saved config fits (same kind and engine_type in
      list_pipeline_configs) use draft_pipeline_config instead; otherwise
      copy a config's kind, pipeline, packages/checks, engine, workers and
      tables (get_pipeline_config). Set input_address / output_address to
      address NAMES exactly as returned by list_addresses (e.g. CHAR_DEMO).
      Else use *_connection + *_location as a plain DATABASE/SCHEMA path (the
      exact location read / written). Omit batch_id. For copy / move, omit tables or
      pass ["all"] - the server lists the source; do NOT guess table names
      from a CDM. Pass explicit names only for a subset. engine: a
      list_engines name or bare type (pyspark, databricks_spark, snowpark);
      omit for pyspark. A user-named engine ("using snowpark") must be
      kept - never silently drop it.
    method: POST
    path: /api/v1/job-drafts
    capability: submit_jobs
    opens_draft: true
    params:
      type: object
      required: [pipeline]
      properties:
        kind: {type: string, enum: [etl, analysis, dq_checks, health, copy, move], default: etl}
        pipeline: {type: string}
        batch_id: {type: string, description: "Omit - derived from the input location."}
        cdm: {type: string}
        input_address: {type: string, description: "Saved address name from list_addresses (preferred)."}
        output_address: {type: string, description: "Saved address name from list_addresses (preferred)."}
        input_connection: {type: string, description: "Only if no saved address fits."}
        input_location: {type: string, description: "Plain path, e.g. CHAR_DEMO/PUBLIC. Never JSON."}
        output_connection: {type: string, description: "Only if no saved address fits."}
        output_location: {type: string, description: "Plain path, e.g. SANDBOX/PUBLIC. Never JSON."}
        tables: {type: array, items: {type: string}, description: "copy/move: omit or [\"all\"] to copy every source table (server expands it); explicit names only for a subset."}
        transformations: {type: array, items: {type: string}}
        engine: {type: string, description: "Engine name from list_engines; omit for pyspark."}
        workers: {type: integer, minimum: 1, maximum: 200, description: "Spark worker containers; ignored for DuckDB / Snowpark."}
        packages: {type: array, items: {type: string}}
        parts: {type: array, items: {type: string}}
        checks: {type: array, items: {type: string}}

  # ======================================================= proposals (write)
  # Never executed by the LLM executor. The user clicks Run in the panel.

  - name: submit_run
    description: >-
      PROPOSE enqueuing a new job immediately (skips the draft review; prefer
      create_job_draft). kind is one of etl, analysis, dq_checks,
      health, copy, move. Requires pipeline plus an input and output
      (address names, or connection + location); each is the exact location
      read / written. batch_id is derived from the input. If the output
      already holds tables the API answers 409 overwrite_required - propose
      again with confirm_overwrite true only if the user wants to replace
      them. The user must confirm before anything runs.
    method: POST
    path: /api/v1/runs
    capability: submit_jobs
    params:
      type: object
      required: [pipeline]
      properties:
        kind: {type: string, enum: [etl, analysis, dq_checks, health, copy, move], default: etl}
        pipeline: {type: string}
        batch_id: {type: string, description: "Omit - derived from the input location."}
        confirm_overwrite: {type: boolean, description: "Replace tables already at the output (only after a 409 and the user's say-so)."}
        cdm: {type: string}
        input_address: {type: string}
        output_address: {type: string}
        input_connection: {type: string}
        input_location: {type: string}
        output_connection: {type: string}
        output_location: {type: string}
        tables: {type: array, items: {type: string}}
        transformations: {type: array, items: {type: string}}
        engine: {type: string}
        workers: {type: integer, minimum: 1, maximum: 200}
        packages: {type: array, items: {type: string}}
        parts: {type: array, items: {type: string}}
        checks: {type: array, items: {type: string}}

  - name: draft_pipeline_config
    description: >-
      DRAFT a run of a saved pipeline configuration (name from
      list_pipeline_configs, e.g. DC_CHECKS) and open it on the Jobs page,
      ready to run. Nothing executes - the user presses the Run button there.
      Use this for "run <config> on A into B": pass input_address /
      output_address as saved address NAMES from list_addresses (they fill
      the config's open input/output for this run), plus optional tables.
      Every address is the exact location read / written; the batch id is
      derived from the input. PREFERRED for "copy / move A
      to B using <engine>": choose the copy / move config whose engine_type
      matches the requested engine, then map A and B to address names
      (a phrase like "<db> <schema>" matches an address whose location is
      <DB>/<SCHEMA>, a bare "<db>" one whose location is just <DB>; read
      list_addresses, never invent names). The config supplies the engine.
    method: POST
    path: /api/v1/pipelines/{name}/draft
    capability: submit_jobs
    opens_draft: true
    params:
      type: object
      required: [name]
      properties:
        name: {type: string, description: "Saved pipeline config name."}
        batch_id: {type: string, description: "Omit - derived from the input location."}
        tables: {type: array, items: {type: string}}
        input_address: {type: string, description: "Saved address name from list_addresses."}
        output_address: {type: string, description: "Saved address name from list_addresses."}

  - name: create_connection
    description: >-
      PROPOSE creating a storage account (connection). The user sees an
      editable form prefilled with what you pass, completes any missing field
      and clicks Run. Use it whenever a storage account the user names does not
      exist - never tell the user you cannot create one. Pass type and the
      non-secret args you know (list_connection_types; ods_resolve suggests a
      disc host_path next to an existing account). NEVER pass secret values:
      the user types passwords / keys into the form, you never see them. For
      a read-only input feed use mount_mode ro.
    method: POST
    path: /api/v1/connections/{name}
    capability: manage_config
    params:
      type: object
      required: [name, type]
      properties:
        name: {type: string, description: "Letters, digits, '-', '_', '.', e.g. inboxarchive_nu."}
        type: {type: string, description: "Storage type from list_connection_types, e.g. disc."}
        args:
          type: object
          description: "Non-secret fields, e.g. {\"host_path\": \"/data/inbox/NU\", \"mount_mode\": \"ro\"}."

  - name: create_address
    description: >-
      PROPOSE creating a saved address (an exact location on a storage
      account) that runs and workflows use as input / output. The user sees
      an editable form and clicks Run. Folder stores take location
      {path, format}; warehouses (snowflake ...) take {database, schema}, e.g.
      {"database": "CHAR_DEMO", "schema": "PUBLIC"}. The connection may be one
      you propose with create_connection in the same answer.
    method: POST
    path: /api/v1/addresses/{name}
    capability: manage_config
    params:
      type: object
      required: [name, connection]
      properties:
        name: {type: string, description: "Letters, digits, '-', '_', e.g. CHAR_DEMO or inbox_demo."}
        connection: {type: string, description: "Storage account name."}
        location: {type: object, description: "Exact location under the account; {} = its top."}

  - name: cancel_job
    description: PROPOSE cancelling a queued or running job. The user must confirm.
    method: POST
    path: /api/v1/jobs/{job_id}/cancel
    capability: submit_jobs
    params:
      type: object
      required: [job_id]
      properties:
        job_id: {type: string}

  - name: pause_job
    description: PROPOSE pausing a queued or running job at its next table boundary (the current table finishes first). The user must confirm.
    method: POST
    path: /api/v1/jobs/{job_id}/pause
    capability: submit_jobs
    params:
      type: object
      required: [job_id]
      properties:
        job_id: {type: string}

  - name: resume_job
    description: PROPOSE resuming a paused job; it continues with its next table. The user must confirm.
    method: POST
    path: /api/v1/jobs/{job_id}/resume
    capability: submit_jobs
    params:
      type: object
      required: [job_id]
      properties:
        job_id: {type: string}

  - name: rerun_job
    description: PROPOSE re-submitting a finished job with the same payload. It writes to the same exact output, so after a 409 overwrite_required propose again with confirm_overwrite true if the user wants to replace the data. The user must confirm.
    method: POST
    path: /api/v1/jobs/{job_id}/rerun
    capability: submit_jobs
    params:
      type: object
      required: [job_id]
      properties:
        job_id: {type: string}
        confirm_overwrite: {type: boolean}

  - name: enable_pipeline_config
    description: PROPOSE enabling a saved pipeline configuration's schedule. The user must confirm.
    method: POST
    path: /api/v1/pipelines/{name}/enable
    capability: submit_jobs
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}

  - name: disable_pipeline_config
    description: PROPOSE disabling a saved pipeline configuration's schedule. The user must confirm.
    method: POST
    path: /api/v1/pipelines/{name}/disable
    capability: submit_jobs
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}

  # -------------------------------------------------------------- workflows
  # A workflow chains saved pipeline configs into a DAG. The assistant
  # reads them, and DRAFTS new ones (saved disabled and opened on the
  # workflow canvas for the human to review / save / enable / run).

  - name: list_workflows
    description: >-
      List workflows (chains of saved pipeline configs) with their trigger,
      enabled flag, step / link counts and last run status.
    method: GET
    path: /api/v1/workflows
    capability: view_pipeline_data

  - name: get_workflow
    description: >-
      One workflow by name - its steps (id, pipeline config name, overrides
      for input_address / output_address / tables / allow_overwrite,
      rollback flag), links (from, to, type data|after) and trigger.
    method: GET
    path: /api/v1/workflows/{name}
    capability: view_pipeline_data
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}

  - name: list_workflow_runs
    description: >-
      Recent workflow runs (newest first), optionally for one workflow: run
      status (running, succeeded, rolled_back, rollback_failed, cancelled),
      trigger, batch and per-step state.
    method: GET
    path: /api/v1/workflow-runs
    capability: view_runs
    params:
      type: object
      properties:
        workflow: {type: string}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}

  - name: get_workflow_run
    description: >-
      One workflow run: each step's status, job id, input / output address,
      error and rollback action.
    method: GET
    path: /api/v1/workflow-runs/{run_id}
    capability: view_runs
    params:
      type: object
      required: [run_id]
      properties:
        run_id: {type: string}

  - name: draft_workflow
    description: >-
      DRAFT a new workflow and open it on the workflow canvas for the user
      (saved DISABLED; nothing runs - the user reviews, saves, enables or runs
      it). Each step names a saved pipeline config from list_pipeline_configs
      (never a package) and gets a short lower-case id. Links: type "data"
      when the next step must read what the previous one wrote (its input
      becomes the previous output - use for "then copy the result to ...");
      type "after" when the next step only has to wait and keeps its own
      source and destination. Steps whose config keeps an input / output open need
      overrides.input_address / output_address (address NAMES from
      list_addresses). trigger defaults to the first config's trigger
      (manual / cron + cron / interval + interval_minutes / watch). Leave
      allow_overwrite unset unless the user asked to replace existing data.
      Branch with link "on" (failure = recovery, otherwise = else) and
      "when"; a step joining branches sets join "any" (else one data link).
    method: POST
    path: /api/v1/workflow-drafts
    capability: manage_config
    opens_draft: true
    params:
      type: object
      required: [name, steps]
      properties:
        name: {type: string, description: "Workflow name: letters, digits, '-', '_', '.'."}
        description: {type: string, maxLength: 500}
        trigger:
          type: object
          properties:
            type: {type: string, enum: [manual, cron, interval, watch]}
            cron: {type: string}
            interval_minutes: {type: integer, minimum: 1}
            watch_min_wait_minutes: {type: integer, minimum: 0}
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [id, pipeline]
            properties:
              id: {type: string, description: "Lower-case step id, unique."}
              pipeline: {type: string, description: "Saved pipeline config name."}
              label: {type: string}
              rollback: {type: boolean, default: true}
              join: {type: string, enum: [all, any], default: all}
              overrides:
                type: object
                properties:
                  input_address: {type: string}
                  output_address: {type: string}
                  tables: {type: array, items: {type: string}}
                  allow_overwrite: {type: boolean}
              probes:
                type: array
                maxItems: 10
                description: >-
                  Numbers computed on this step's output for query.<name>
                  conditions. A probe with "where" needs human approval; add one
                  only when the user asked for a data-based condition.
                items:
                  type: object
                  required: [name, table]
                  properties:
                    name: {type: string}
                    table: {type: string}
                    agg: {type: string, enum: [count, count_distinct, null_count, non_null_count]}
                    column: {type: string}
                    where: {type: string}
        edges:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: {type: string}
              to: {type: string}
              type: {type: string, enum: [data, after], default: data}
              on: {type: string, enum: [success, failure, always, otherwise], default: success}
              when:
                type: object
                description: >-
                  Condition over the upstream step's facts: {all:[...]} / {any:[...]} /
                  {not:{...}} / {field, op, value}. E.g. {"all": [{"field":
                  "health.blockers", "op": "eq", "value": 0}, {"field":
                  "tables_completed", "op": "contains", "value": "DEMOGRAPHIC"}]}.
                  Fields: status, error, duration_s, batch_id, root_input,
                  tables_completed, tables_failed, warnings, table.<T>.status,
                  health.blockers, health.pass_rate, health.check.<id>.status,
                  output.tables, rows.<T>, query.<probe>. Ops: eq ne gt gte lt lte
                  between in not_in contains not_contains starts_with ends_with
                  matches contains_any contains_all is_empty is_not_empty exists
                  not_exists is_true is_false.
              label: {type: string}

  - name: run_workflow
    description: >-
      PROPOSE running a saved workflow now (its trigger is ignored). Steps run
      as jobs; if one fails the finished steps are rolled back. The user must
      confirm.
    method: POST
    path: /api/v1/workflows/{name}/run
    capability: submit_jobs
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}
        input_address: {type: string, description: "Optional: address NAME the first step reads for this run."}

  - name: duplicate_workflow
    description: PROPOSE copying a workflow under a new name (the copy starts disabled). The user must confirm.
    method: POST
    path: /api/v1/workflows/{name}/duplicate
    capability: manage_config
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}
        new_name: {type: string}

  - name: enable_workflow
    description: PROPOSE enabling a workflow's trigger (schedule / watch). The user must confirm.
    method: POST
    path: /api/v1/workflows/{name}/enable
    capability: submit_jobs
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}

  - name: disable_workflow
    description: PROPOSE disabling a workflow's trigger. The user must confirm.
    method: POST
    path: /api/v1/workflows/{name}/disable
    capability: submit_jobs
    params:
      type: object
      required: [name]
      properties:
        name: {type: string}

  - name: cancel_workflow_run
    description: PROPOSE cancelling a running workflow; its finished steps are rolled back. The user must confirm.
    method: POST
    path: /api/v1/workflow-runs/{run_id}/cancel
    capability: submit_jobs
    params:
      type: object
      required: [run_id]
      properties:
        run_id: {type: string}

  # ------------------------------------------------------- Report Studio
  # The assistant is the primary planner of reports: it reads sources
  # (schema + aggregates only; row_values columns are masked for agents),
  # the chart library and templates, then DRAFTS a report (opens it in the
  # Studio) and edits the open report with the edit_report_layout UI action.
  # Saving, sharing and exporting stay with the human.
  - name: list_report_sources
    description: >-
      List report sources: durable, aggregated datasets published by finished runs
      (kind health / analysis / run_summary / health_trend), newest first. Each has
      source_id, kind, title, pipeline, batch_id, generated_at, dataset row counts and
      recommended_templates.
    method: GET
    path: /api/v1/report-sources
    capability: view_runs
    params:
      type: object
      properties:
        kind: {type: string, enum: [health, analysis, run_summary, health_trend]}
        pipeline: {type: string}
        instance_id: {type: string}
        q: {type: string, description: "Substring of title / batch / id."}
        limit: {type: integer, minimum: 1, maximum: 100, default: 20}

  - name: get_report_source
    description: >-
      Describe one report source: every dataset with its columns (name, type,
      sensitivity, distinct count, min/max or example values) and row count - never the
      rows. Use the column names and types to choose chart params.
    method: GET
    path: /api/v1/report-sources/{source_id}
    capability: view_runs
    params:
      type: object
      required: [source_id]
      properties:
        source_id: {type: string}

  - name: get_report_catalogue
    description: >-
      The Report Studio library: every chart kind (name, category, summary, params JSON
      Schema - x-field lists the column types a param accepts), the report themes, the
      layout edit ops and export formats. Read it before planning charts.
    method: GET
    path: /api/v1/report-catalogue
    capability: view_runs
    max_result_chars: 60000

  - name: list_report_templates
    description: Recommended report layouts (built-in and the user's own) per source kind.
    method: GET
    path: /api/v1/report-templates
    capability: view_runs
    params:
      type: object
      properties:
        source_kind: {type: string, enum: [health, analysis, run_summary, health_trend]}

  - name: get_report_template
    description: One report template including its full layout (sections and blocks).
    method: GET
    path: /api/v1/report-templates/{template_id}
    capability: view_runs
    params:
      type: object
      required: [template_id]
      properties:
        template_id: {type: string}

  - name: list_reports
    description: >-
      Reports visible to the user (scope all / mine / shared / favorites), with title,
      folder, tags, source_id, version and permission.
    method: GET
    path: /api/v1/reports
    capability: view_runs
    params:
      type: object
      properties:
        scope: {type: string, enum: [all, mine, shared, favorites], default: all}
        q: {type: string}
        source_id: {type: string}

  - name: get_report
    description: >-
      One saved report: metadata, the full layout and a compact outline with section /
      block ids (the ids edit_report_layout ops refer to).
    method: GET
    path: /api/v1/reports/{report_id}
    capability: view_runs
    params:
      type: object
      required: [report_id]
      properties:
        report_id: {type: string}

  - name: create_report_draft
    description: >-
      DRAFT a new report and open it in the Report Studio for the user (private, not
      shared or exported). Give source_id (from list_report_sources) plus either a
      template_id (from list_report_templates) or a full layout {v: 1, title, theme,
      sections: [{id, title, blocks: [{id, type: chart|text|callout, chart, dataset,
      params, title, width, visible}]}]} whose chart params use real column names from
      get_report_source. Omit both to use the source's recommended template.
    method: POST
    path: /api/v1/report-drafts
    capability: run_reports
    opens_draft: true
    params:
      type: object
      required: [source_id]
      properties:
        source_id: {type: string}
        template_id: {type: string}
        layout: {type: object}
        title: {type: string, maxLength: 160}
        description: {type: string, maxLength: 2000}
        folder: {type: string, maxLength: 120}
        tags: {type: array, items: {type: string}, maxItems: 12}

  - name: save_report
    description: >-
      PROPOSE saving a report's layout / title / folder / tags as a new version. The
      user confirms. Prefer edit_report_layout for changes to the open report - the
      user saves those from the Studio.
    method: PUT
    path: /api/v1/reports/{report_id}
    capability: run_reports
    params:
      type: object
      required: [report_id]
      properties:
        report_id: {type: string}
        layout: {type: object}
        title: {type: string, maxLength: 160}
        folder: {type: string, maxLength: 120}
        tags: {type: array, items: {type: string}, maxItems: 12}

  - name: export_report
    description: >-
      PROPOSE exporting a saved report (pdf / html / docx / pptx / xlsx / svg / png / md / json).
      Hidden sections are never exported. The user confirms and downloads the file.
    method: POST
    path: /api/v1/reports/{report_id}/exports
    capability: run_reports
    params:
      type: object
      required: [report_id, format]
      properties:
        report_id: {type: string}
        format: {type: string, enum: [pdf, html, docx, pptx, xlsx, svg, png, md, json]}
        block_id: {type: string, description: "svg / png only: one chart block."}

  # ------------------------------------------------------------ UI actions
  # ui_action: true -> no method / path; never reaches the API. The executor
  # emits a ui_action event, the user's browser re-validates the arguments
  # against its own allow-list (llm_panel.js), applies the change, saves it
  # to that user's own server-side appearance profile (the Appearance
  # panel's store, PUT /api/v1/me/appearance) and shows an Undo button.
  # The assistant's own token can never call that route. Cosmetic and
  # reversible by construction. Description must start with "UI:"; the set
  # of names is pinned by the contract test.
  - name: set_appearance
    description: >-
      UI: change how the Ovid2 web pages look for this user (saved to their own profile).
      Applies immediately and the user can undo it. Use only when the user asks to
      change the theme, colours, fonts or text sizes. Setting `theme` switches the
      base theme and clears earlier colour/font overrides first; `colors` and
      `appearance` are then layered on top. `reset: true` clears all overrides
      (keeping the theme). The current appearance is given in the system prompt.
      Keep text readable: pick fg/bg pairs with strong contrast.
    ui_action: true
    capability: use_llm
    params:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        theme:
          type: string
          description: "Base theme (default data-factory): clinical (light, calm hospital teal, IBM Plex), data-factory (light factory floor: concrete ground, safety-yellow gantry topbar, safety-orange accent, conveyor belts, stencilled titles, hazard tape), dune (light noon desert: bleached sand, basalt topbar and drawer, electric eye-blue accent, carved Cinzel capitals, wind ripples), financial (dark trading terminal, amber + green/red tickers, dense), lego (light toy bricks, primary red/blue/yellow/green, studded cards), matrix (black CRT, phosphor-green digital rain), spaceship (dark, sci-fi terminal, teal glow), super-mario-world (16-bit sky blue, cream boxes, brick red + coin gold)."
          enum: [clinical, data-factory, dune, financial, lego, matrix, spaceship, super-mario-world]
        colors:
          type: object
          description: "Quick colour overrides as #rrggbb. surface = cards and raised panels."
          additionalProperties: false
          properties:
            accent: {type: string, pattern: "^#[0-9a-fA-F]{6}$"}
            bg: {type: string, pattern: "^#[0-9a-fA-F]{6}$"}
            surface: {type: string, pattern: "^#[0-9a-fA-F]{6}$"}
            fg: {type: string, pattern: "^#[0-9a-fA-F]{6}$"}
        appearance:
          type: object
          description: >-
            Fine-grained CSS variable overrides per component group. Colours are
            #rrggbb; sizes like "15px" / "0.95rem"; weights 100-900; fonts a CSS
            font stack such as "Georgia, serif" or one of var(--font-sans),
            var(--font-serif), var(--mono), var(--font-display).
          additionalProperties: false
          properties:
            "--bg": {type: string, pattern: "^#[0-9a-fA-F]{6}$", description: page background}
            "--bg-elev": {type: string, pattern: "^#[0-9a-fA-F]{6}$", description: raised surfaces}
            "--card-bg": {type: string, pattern: "^#[0-9a-fA-F]{6}$", description: cards and tables}
            "--fg": {type: string, pattern: "^#[0-9a-fA-F]{6}$", description: body text}
            "--accent": {type: string, pattern: "^#[0-9a-fA-F]{6}$", description: accent and buttons}
            "--drawer-bg": {type: string, pattern: "^#[0-9a-fA-F]{6}$", description: navigation drawer}
            "--body-ff": {type: string, pattern: "^(var\\(--(font-sans|font-serif|mono|font-display)\\)|[A-Za-z0-9 ,\"'-]{1,160})$"}
            "--body-fs": {type: string, pattern: "^[0-9]{1,2}(\\.[0-9]{1,3})?(px|rem|em)$"}
            "--body-fw": {type: string, pattern: "^[1-9]00$"}
            "--btn-ff": {type: string, pattern: "^(var\\(--(font-sans|font-serif|mono|font-display)\\)|[A-Za-z0-9 ,\"'-]{1,160})$"}
            "--btn-fs": {type: string, pattern: "^[0-9]{1,2}(\\.[0-9]{1,3})?(px|rem|em)$"}
            "--btn-fw": {type: string, pattern: "^[1-9]00$"}
            "--card-ff": {type: string, pattern: "^(var\\(--(font-sans|font-serif|mono|font-display)\\)|[A-Za-z0-9 ,\"'-]{1,160})$"}
            "--card-fs": {type: string, pattern: "^[0-9]{1,2}(\\.[0-9]{1,3})?(px|rem|em)$"}
            "--card-fw": {type: string, pattern: "^[1-9]00$"}
            "--table-fs": {type: string, pattern: "^[0-9]{1,2}(\\.[0-9]{1,3})?(px|rem|em)$"}
            "--nav-ff": {type: string, pattern: "^(var\\(--(font-sans|font-serif|mono|font-display)\\)|[A-Za-z0-9 ,\"'-]{1,160})$"}
            "--nav-fs": {type: string, pattern: "^[0-9]{1,2}(\\.[0-9]{1,3})?(px|rem|em)$"}
            "--nav-fw": {type: string, pattern: "^[1-9]00$"}
        reset:
          type: boolean
          description: "true clears every colour/font override (applied before colors/appearance)."

  - name: save_appearance
    description: >-
      UI: save the user's current look (base theme plus all overrides) as a named
      saved theme in their profile, overwriting a saved theme with the same name.
      The user can undo it. Call set_appearance first if the look should change.
    ui_action: true
    capability: use_llm
    params:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 60, pattern: "^[^<>]{1,60}$"}

  - name: apply_saved_appearance
    description: >-
      UI: switch to one of the user's saved themes by name (names are listed in the
      system prompt). Applies immediately on their pages; the user can undo it.
    ui_action: true
    capability: use_llm
    params:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 60}

  # Workflow canvas hand-off: opens /workflows/new in the user's browser with
  # an UNSAVED working copy pre-filled from these steps / links. Nothing is
  # stored on the server - the human binds what is missing and presses Save
  # (the canvas validates against the live API as usual). The browser
  # re-checks every name against the configs / addresses the page lists and
  # drops anything unknown; Undo returns to the previous page.
  # Amendment to adr-llm-dual-system.md ("UI actions").
  - name: open_workflow_canvas
    description: >-
      UI: open the workflow canvas (/workflows/new) in the user's browser with an
      UNSAVED draft built from these steps and links, for the user to finish and Save.
      Use it instead of draft_workflow when the workflow cannot be saved yet - an
      input / output address is unknown, or the user has to choose a pipeline - and
      list what is still open in `missing`. Same step / link shape as draft_workflow
      (step.pipeline = saved config name from list_pipeline_configs; overrides take
      address NAMES from list_addresses; leave unknown ones out). After calling it,
      tell the user in plain words what is pre-filled and what they still have to
      pick. Applies at once; the user can undo it.
    ui_action: true
    # Only offered to users who can save a workflow (same as draft_workflow);
    # a viewer would land on a read-only canvas.
    capability: manage_config
    params:
      type: object
      additionalProperties: false
      required: [steps]
      properties:
        name: {type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$", description: "Suggested workflow name."}
        description: {type: string, maxLength: 500}
        steps:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [id, pipeline]
            properties:
              id: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,39}$"}
              pipeline: {type: string, pattern: "^[A-Za-z0-9_.-]{1,64}$", description: "Saved pipeline config name."}
              label: {type: string, maxLength: 80, pattern: "^[^<>]*$"}
              overrides:
                type: object
                additionalProperties: false
                properties:
                  input_address: {type: string, pattern: "^[A-Za-z0-9_.:-]{1,128}$"}
                  output_address: {type: string, pattern: "^[A-Za-z0-9_.:-]{1,128}$"}
                  tables: {type: array, maxItems: 100, items: {type: string, pattern: "^[A-Za-z0-9_*]{1,64}$"}}
        edges:
          type: array
          maxItems: 40
          items:
            type: object
            additionalProperties: false
            required: [from, to]
            properties:
              from: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,39}$"}
              to: {type: string, pattern: "^[a-z0-9][a-z0-9_-]{0,39}$"}
              type: {type: string, enum: [data, after], default: data}
              on: {type: string, enum: [success, failure, always, otherwise], default: success}
        missing:
          type: array
          maxItems: 10
          description: "Short notes on what the user still has to fill in (shown on the canvas)."
          items: {type: string, maxLength: 160, pattern: "^[^<>]*$"}

  # Report Studio: edits the report open in the user's browser (the Studio's
  # working copy). The browser re-validates every op against the same
  # server validator (POST /reports/{id}/ops save=false) before applying it;
  # the change is undoable and nothing is saved until the human presses
  # Save. Cosmetic in the UI-action sense: it never persists, shares or
  # exports. Amendment to adr-llm-dual-system.md (adr-report-studio.md).
  - name: edit_report_layout
    description: >-
      UI: edit the report open in the Report Studio (outline with ids is in the system
      prompt). Applies ops to the user's working copy with Undo; the user saves. Ops:
      set_report {set}; add_section {title, index?, kind? content|notes}; update_section
      {section_id, set, merge_style?}; move_section {section_id, index}; remove_section
      {section_id}; add_block {section_id, index?, block}; update_block {block_id, set,
      merge_params?, merge_style?}; move_block {block_id, section_id?, index};
      remove_block {block_id}; set_visibility {target_id, visible}. Block types: chart
      (chart, dataset, params), text / callout (text, tone), note (text), info (rows
      [{key, value}]), checklist (items [{text, done}]), divider, spacer (size). Any block:
      title, width, export (false = not exported), style {accent, background, text_color
      (theme role, palette:N, status:x or #rrggbb), align, emphasis, font_scale, border,
      padding}; merge_style + null resets a key. Chart params use the dataset's columns.
    ui_action: true
    capability: use_llm
    params:
      type: object
      additionalProperties: false
      required: [ops]
      properties:
        ops:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: object
            required: [op]
            properties:
              op:
                type: string
                enum: [set_report, add_section, update_section, move_section, remove_section, add_block, update_block, move_block, remove_block, set_visibility]
        note: {type: string, maxLength: 200, description: "One-line summary shown to the user."}
