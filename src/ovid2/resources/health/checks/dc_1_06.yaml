enabled: true
doc_summary: >-
  DC 1.06 (Table IIB): every column bound to a CDM-declared bounded valueset
  holds only permissible values (excluding flavour-of-null sentinels).
  Non-conformance is a conformance exception (any occurrence flags).
doc_interpretation: >-
  OUT_OF_VALUESET_ROWS > 0 (EXCEPTION) means a field carries values that do
  not conform to the CDM specification.
