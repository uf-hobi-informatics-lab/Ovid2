doc_summary: >-
  DC 2.04 (Table IIID): for ED/EI/IP encounter types, no more than 2
  encounters per distinct visit (PATID + ADMIT_DATE + ENC_TYPE).
doc_interpretation: >-
  ENCOUNTERS_PER_VISIT above 2 (EXCEPTION) suggests visit-splitting - a single
  visit represented as many encounter rows.
