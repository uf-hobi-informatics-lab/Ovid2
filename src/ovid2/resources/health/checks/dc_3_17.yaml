id: "3.17"
name: DC 3.17
part: part3
edc_table: Table IVI
description: Fewer than 80% of quantitative OBS_CLIN results specify a result unit
operator: known_value_coverage
source_tables:
  - OBS_CLIN
na_when_empty:
  - OBS_CLIN
params:
  coverage:
    - {table: OBS_CLIN, column: OBSCLIN_RESULT_UNIT}
metrics:
  - COVERAGE_PCT
exception_metrics:
  - COVERAGE_PCT
thresholds:
  coverage_pct_lt: 80.0
enabled: true
doc_summary: >-
  DC 3.17 (Table IVI): at least 80% of OBS_CLIN records carry a populated
  OBSCLIN_RESULT_UNIT.
doc_interpretation: >-
  COVERAGE_PCT below 80% (EXCEPTION) means quantitative clinical observations
  frequently omit units.
