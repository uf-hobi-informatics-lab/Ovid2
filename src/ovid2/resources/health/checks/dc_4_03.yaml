id: "4.03"
name: DC 4.03
part: part4
edc_table: Table VC
description: Code-type distribution counts dropped to zero or decreased >5% vs the prior refresh
operator: refresh_trend
source_tables:
  - DIAGNOSIS
  - PROCEDURES
  - DISPENSING
  - IMMUNIZATION
  - MED_ADMIN
  - PRESCRIBING
  - OBS_CLIN
  - PRO_CM
params: {}
metrics:
  - CURRENT_ROWS
  - PRIOR_ROWS
  - RECORD_DELTA_PCT
exception_metrics:
  - RECORD_DELTA_PCT
thresholds:
  decrease_pct_lt: -5.0
enabled: true
doc_summary: >-
  DC 4.03 (Table VC): selected code-type distributions (diagnosis, procedure,
  NDC, immunization, med-admin, prescribing, obs-clin code types) did not drop
  to zero or decrease more than 5% versus the previous refresh.
doc_interpretation: >-
  RECORD_DELTA_PCT below -5% or a drop to zero (EXCEPTION) means a code-type
  distribution lost records between refreshes.
