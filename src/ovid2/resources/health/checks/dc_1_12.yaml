    - {child: MED_ADMIN, child_key: MEDADMIN_PROVIDERID, parent: PROVIDER, parent_key: PROVIDERID}
    - {child: OBS_CLIN, child_key: OBSCLIN_PROVIDERID, parent: PROVIDER, parent_key: PROVIDERID}
    - {child: OBS_GEN, child_key: OBSGEN_PROVIDERID, parent: PROVIDER, parent_key: PROVIDERID}
    - {child: IMMUNIZATION, child_key: VX_PROVIDERID, parent: PROVIDER, parent_key: PROVIDERID}
metrics:
  - CHILD_ROWS
  - ORPHAN_ROWS
  - ORPHAN_PCT
