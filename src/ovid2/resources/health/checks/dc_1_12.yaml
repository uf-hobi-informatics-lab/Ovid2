  orphan_rows_gt: 0
enabled: true
doc_summary: >-
  DC 1.12 (Table IIE): every PROVIDERID referenced by a data table exists in
  PROVIDER.
doc_interpretation: >-
  ORPHAN_ROWS > 0 (EXCEPTION) means a table references a provider that has no
  PROVIDER record.
