# Quiet Log4j 2 config for Ovid2 — suppress Spark startup noise.
#
# Spark >= 3.3 uses Log4j 2; the Log4j 1 ``log4j.rootCategory=`` syntax
# this file used to carry was silently ignored. Passed to the driver JVM
# via ``-Dlog4j2.configurationFile=`` (``ovid2.config.settings.SPARK_CONFIG``).
# Only ERROR-level messages are shown during JVM initialization. After
# SparkSession creation, Python-side setLogLevel('OFF') takes over.
rootLogger.level = error
rootLogger.appenderRef.stderr.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
