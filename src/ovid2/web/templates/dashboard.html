{% extends "base.html" %}
{% block title %}Dashboard &mdash; Ovid2{% endblock %}
{% block content %}
<section class="page">
  <div class="page-header">
    <h1>Dashboard</h1>
    <div class="page-actions">
      <a href="/submit" class="button primary small">+ Submit run</a>
      <a href="/health" class="button small">Health</a>
    </div>
  </div>
  <div id="dashboard-body"
       hx-get="/partials/dashboard"
       hx-trigger="every {{ poll_ms }}ms"
       hx-swap="innerHTML">
    {% include "_dashboard_body.html" %}
  </div>
</section>
{% endblock %}
