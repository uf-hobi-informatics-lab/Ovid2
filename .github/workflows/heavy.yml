# Heavy gates for Ovid2: integration tests and the DuckDB × driver I/O matrix.
#
# Free on the public mirror (GitHub-hosted runners, public repo). Runs only
# when engine / driver / pipeline / integration-test code changes — no
# nightly timer — plus on demand and a weekly drift check (pinned emulator
# digests drift only when bumped; the DuckDB postgres extension and the
# runner images can drift on their own).

name: Heavy gates

on:
  push:
    branches: [main]
    paths:
      - "src/ovid2/core/engines/**"
      - "src/ovid2/drivers/**"
      - "src/ovid2/connections/**"
      - "src/ovid2/transformations/**"
      - "src/ovid2/mappers/**"
      - "src/ovid2/formatters/**"
      - "pipelines/ovid2_pipelines/example_pcornet/**"
      - "pipelines/ovid2_pipelines/pcornet_to_omop/**"
      - "tests/integration/**"
      - "pyproject.toml"
      - "scripts/ci_checks.sh"
      - ".github/workflows/heavy.yml"
  pull_request:
    paths:
      - "src/ovid2/core/engines/**"
      - "src/ovid2/drivers/**"
      - "src/ovid2/connections/**"
      - "src/ovid2/transformations/**"
      - "src/ovid2/mappers/**"
      - "src/ovid2/formatters/**"
      - "pipelines/ovid2_pipelines/example_pcornet/**"
      - "pipelines/ovid2_pipelines/pcornet_to_omop/**"
      - "tests/integration/**"
      - "pyproject.toml"
      - "scripts/ci_checks.sh"
      - ".github/workflows/heavy.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly drift check, Mondays 06:17 UTC

concurrency:
  group: heavy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install package (all test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spark,web,mcp,azure]"
      - name: Integration gate
        run: bash scripts/ci_checks.sh integration

  io_matrix:
    name: DuckDB x driver I/O matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install package (driver extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spark,web,mcp,azure,s3,gcs,postgres,mssql]"
      - name: io_matrix gate
        run: bash scripts/ci_checks.sh io_matrix
