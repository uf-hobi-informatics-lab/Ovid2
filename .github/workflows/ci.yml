# Continuous integration for Ovid2.
#
# Every gate calls scripts/ci_checks.sh — the same script the public-mirror
# publisher runs before pushing, and that contributors run locally
# (``scripts/ci_checks.sh --docker`` reproduces this environment exactly).
# Every job installs the same extras set so results never depend on which
# job ran a check. Integration / real_connection / real_cluster / perf /
# endurance tests are excluded here — they require live clusters, cloud credentials, or
# long run times and are opt-in via their pytest markers.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install "ruff==0.16.1"
      - name: ruff check + format --check
        run: bash scripts/ci_checks.sh lint

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + type stubs
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spark,web,mcp,azure]"
      - name: mypy
        run: bash scripts/ci_checks.sh typecheck

  contract:
    name: Contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package (all test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spark,web,mcp,azure]"
      - name: pytest -m contract
        run: bash scripts/ci_checks.sh contract

  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up JDK 17 (for the local Spark fixture)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install package (dev + spark extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,spark,web,mcp,azure]"
      - name: Run unit suite (exclude heavyweight / opt-in markers)
        run: bash scripts/ci_checks.sh unit

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build distributions
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
